<title>Holy Impact 새가족</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@400;600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: Quiet Editorial — off-white paper, charcoal ink, one soft sky arc as the only flourish. Phone frames for 새가족, wide panels for 순장. */
:root{
  --paper:#FFFFFF; --surface:#FFFFFF; --soft:#F5F7F9; --sand:#EDF1F4; --ink:#1E2A30; --muted:#6C7275;
  --sky:#A0C4E0; --sky-soft:#DCEAF5; --sky-deep:#2F7FC1; --line:rgba(30,42,48,.10);
  --ok:#3C8C68; --ok-soft:#E1F0E8; --warn:#B9741F; --warn-soft:#F6E9D6;
  --frame:#1E2A30;
  --f-display:"Outfit","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12181B; --surface:#1A2226; --soft:#1F282C; --sand:#2A3233; --ink:#ECE7E0; --muted:#9AA3A6;
  --sky:#6FA6D3; --sky-soft:#1F3444; --sky-deep:#8CC4F0; --line:rgba(236,231,224,.12);
  --ok:#6CC398; --ok-soft:#1E3329; --warn:#E3A55A; --warn-soft:#3A2E1E; --frame:#000; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12181B; --surface:#1A2226; --soft:#1F282C; --sand:#2A3233; --ink:#ECE7E0; --muted:#9AA3A6;
  --sky:#6FA6D3; --sky-soft:#1F3444; --sky-deep:#8CC4F0; --line:rgba(236,231,224,.12);
  --ok:#6CC398; --ok-soft:#1E3329; --warn:#E3A55A; --warn-soft:#3A2E1E; --frame:#000; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky-deep);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:10px}
.mark{font-family:var(--f-display);font-weight:800;line-height:.9;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.mark small{display:block;font-family:var(--f-body);font-weight:500;font-size:10px;letter-spacing:.24em;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:999px;white-space:nowrap;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tab .dev{font-size:10px;letter-spacing:.12em;border:1px solid var(--line);border-radius:4px;padding:1px 4px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab[aria-selected="true"] .dev{border-color:rgba(255,255,255,.3)}

main{padding-block:28px 64px}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-size:clamp(24px,3vw,32px);margin:0;line-height:1.2;text-wrap:balance;font-weight:700}
h2,h3,h4{text-wrap:balance}
h3{font-size:17px;margin:0 0 12px}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--sand);white-space:nowrap}
.pill.sky{background:var(--sky-soft);color:var(--sky-deep)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-weight:500;font-size:14px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:5px 12px;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;box-shadow:0 1px 2px rgba(30,42,48,.03)}
.note{font-size:12px;color:var(--muted)}
.demo-tag{font-size:11px;letter-spacing:.12em;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:1px 6px;white-space:nowrap}

/* ---------- PHONE ---------- */
.phone-stage{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:40px;align-items:center}
.phone-side{max-width:300px;min-width:0}
.phone-side.r{justify-self:start}
.phone-side.l{justify-self:end;text-align:right}
.phone-side p{margin:0 0 10px;font-size:14px}
.phone{width:390px;height:780px;border:10px solid var(--frame);border-radius:48px;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 30px 60px -30px rgba(30,42,48,.35);touch-action:pan-x;user-select:none}
.phone input,.phone textarea{user-select:text}
.phone .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:96px;height:26px;border-radius:20px;background:var(--frame);z-index:5}
.prog{position:absolute;top:0;left:0;height:3px;background:var(--sky-deep);transition:width .5s ease;z-index:6}
.stack{position:absolute;inset:0}
.step{position:absolute;inset:0;padding:96px 28px 120px;display:flex;flex-direction:column;transition:transform .6s cubic-bezier(.22,.8,.24,1),opacity .6s ease;will-change:transform}
.step.below{transform:translateY(100%);opacity:0;pointer-events:none}
.step.above{transform:translateY(-100%);opacity:0;pointer-events:none}
.step.here{transform:none;opacity:1}
.qt{font-size:30px;font-weight:700;margin:0 0 6px;line-height:1.25;letter-spacing:-.01em}
.qs{font-size:17px;color:var(--muted);margin:0 0 30px}
.req{color:var(--sky-deep)}
.big{width:100%;border:0;border-bottom:2px solid var(--line);background:transparent;font-size:28px;font-weight:500;padding:8px 0;border-radius:0;outline:none;transition:border-color .2s}
.big:focus{border-color:var(--ink)}
.big::placeholder{color:var(--ink);opacity:.22}
.big.sm{font-size:20px;margin-top:22px}
.big + .big{margin-top:22px}
.choices{display:grid;gap:12px}
.choices.two{grid-template-columns:1fr 1fr}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:18px;font-size:19px;font-weight:500;text-align:left;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,background .15s,transform .1s}
.choices.two .opt{text-align:center;align-items:center;padding:26px 10px}
.opt:active{transform:scale(.98)}
.opt span{font-size:13px;color:var(--muted);font-weight:400}
.opt small{font-size:13px;color:var(--muted);font-weight:400;line-height:1.45;margin-top:4px}
.opt.sel{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.opt.sel span,.opt.sel small{color:var(--paper);opacity:.75}
.townline{margin-top:14px;font-size:16px;min-height:26px;color:var(--sky-deep);font-weight:500}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:10px 0;font-size:15px;align-self:flex-start}
.results{margin-top:14px;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:2px;touch-action:pan-y}
.res{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:0;background:none;padding:11px 4px;border-bottom:1px solid var(--line)}
.res b{font-size:17px;font-weight:600}
.res span{font-size:13px;color:var(--muted)}
.res.add b{color:var(--sky-deep)}
.res.sel{background:var(--sky-soft)}
.nudge{position:absolute;left:0;right:0;bottom:26px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:12px;letter-spacing:.14em;transition:opacity .3s;z-index:4}
.nudge svg{animation:bob 1.6s ease-in-out infinite}
.nudge[hidden]{display:none}
.nudge.dim{opacity:.25}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.hint{font-size:13px;color:var(--warn);min-height:20px;margin-top:10px}

/* welcome */
.welcome{padding:0;justify-content:flex-end}
.arc{position:absolute;right:-60%;top:-18%;width:150%;aspect-ratio:1;border-radius:50%;background:linear-gradient(200deg,#7DB4E3 0%,#A8CDEB 45%,#DCEBF6 100%);overflow:hidden}
.cloud{position:absolute;border-radius:50%;background:#fff;filter:blur(14px);opacity:.92}
.welcome-text{position:relative;padding:0 28px 150px}
.welcome-text .eyebrow{color:var(--ink);opacity:.7;letter-spacing:.38em}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:.92;margin:6px 0 18px;letter-spacing:-.01em}
.welcome-text p.sub{font-size:16px;color:var(--muted);margin:0}

/* done + live */
.done-check{width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;margin-bottom:22px}
.live{margin-top:auto;border-top:1px solid var(--line);padding-top:22px}
.live .lbl{font-size:11px;letter-spacing:.28em;color:var(--muted);margin:0 0 8px;text-transform:uppercase}
.live .kw{font-size:40px;font-weight:800;margin:0 0 14px;line-height:1.15;font-family:var(--f-display);letter-spacing:-.01em;animation:rise .5s ease}
.live .dots{display:flex;gap:6px}
.live .dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.live .dots i.on{background:var(--ink)}
.live .dots i.cur{background:var(--sky-deep)}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.seatinfo{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-top:12px}

/* ---------- LEADER ---------- */
.lhead{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;margin-bottom:22px}
.lmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lmeta label{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;margin-bottom:18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:40px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;margin-bottom:16px}
.pool:empty::before{content:"모두 자리에 앉았어요";color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500;cursor:grab}
.chip.picked{border-color:var(--sky-deep);background:var(--sky-soft)}
.chip .en{font-weight:400;color:var(--muted);font-size:12px}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px 14px;min-width:0}
.thead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.thead b{font-size:14px;margin-right:auto;white-space:nowrap}
.shape-seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.shape-seg button{border:0;background:none;border-radius:999px;padding:3px 9px;font-size:12px;color:var(--muted);white-space:nowrap}
.shape-seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tx{border:0;background:none;color:var(--muted);font-size:18px;width:26px;height:26px;border-radius:50%;padding:0}
.tx:hover{background:var(--soft);color:var(--ink)}
.rtbl{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0}
.srow{display:flex;gap:12px;justify-content:center}
.slab{background:var(--sand);border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--muted);height:58px}
.rtbl.rect22 .slab{width:168px}
.rtbl.rect11 .slab{width:78px}
.seat.st{position:relative;transform:none;width:78px;left:auto;top:auto}
.tbl{position:relative;width:100%;max-width:230px;aspect-ratio:1;margin:0 auto}
.tbl .top-c{position:absolute;inset:27%;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--muted)}
.seat{position:absolute;width:31%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:1.5px dashed var(--line);background:var(--surface);display:grid;place-items:center;text-align:center;font-size:13px;line-height:1.2;padding:4px;color:var(--muted);transition:border-color .15s,background .15s}
.seat.drop{border-color:var(--sky-deep);background:var(--sky-soft)}
.seat.filled{border:1.5px solid var(--ink);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer}
.seat.lead{border:0;background:var(--ink);color:var(--paper);font-weight:500;font-size:12px}
.seat .x{position:absolute;top:-2px;right:-2px;width:20px;height:20px;border-radius:50%;border:0;background:var(--sand);font-size:12px;line-height:20px;padding:0;color:var(--ink)}
.seat small{display:block;font-weight:400;font-size:10px;opacity:.7}

.deck{display:flex;flex-direction:column}
.deck-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.card{flex:1;border-radius:18px;background:var(--surface);border:1px solid var(--line);padding:30px 32px;display:flex;flex-direction:column;min-height:360px;position:relative;overflow:hidden}
.card .num{font-family:var(--f-display);font-size:13px;letter-spacing:.2em;color:var(--muted)}
.card h2{font-size:clamp(28px,3vw,40px);margin:10px 0 18px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:18px}
.card li{padding-left:18px;position:relative}
.card li::before{content:"";position:absolute;left:0;top:.7em;width:7px;height:7px;border-radius:50%;background:var(--sky)}
.card .ask{margin-top:20px;font-size:18px;color:var(--sky-deep);font-weight:500}
.card .ask b{font-size:12px;letter-spacing:.2em;display:block;color:var(--muted);font-weight:500;margin-bottom:2px}
.card-foot{margin-top:auto;padding-top:24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:14px;border:0;background:none;font-size:16px;font-weight:500;padding:0;text-align:left}
.check .box{width:56px;height:56px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;transition:background .2s,transform .2s;flex:none}
.check .box svg{opacity:0;transform:scale(.4);transition:all .25s}
.check.on .box{background:var(--ink);color:var(--paper);transform:scale(1.04)}
.check.on .box svg{opacity:1;transform:none}
.mirror{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.mirror .mini{border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:800;font-family:var(--f-display);font-size:15px;color:var(--ink);background:var(--surface)}
.dotsrow{display:flex;gap:6px}
.dotsrow button{width:26px;height:6px;border-radius:3px;border:0;background:var(--line);padding:0}
.dotsrow button.on{background:var(--ink)}
.dotsrow button.cur{background:var(--sky-deep)}
.card.fin{align-items:flex-start;justify-content:center}

.tablewrap{overflow-x:auto;margin:0 -4px}
table.rows{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
table.rows th{font-size:11px;letter-spacing:.14em;color:var(--muted);text-align:left;font-weight:500;padding:8px 12px;border-bottom:1px solid var(--line)}
table.rows td{padding:12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.rows tbody tr{cursor:pointer}
table.rows tbody tr:hover td{background:var(--soft)}
table.rows td.nm b{font-size:16px}
table.rows td.nm span{color:var(--muted);font-size:12px;margin-left:6px}

.report{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ptabs button{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:14px}
.ptabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field span{font-size:12px;color:var(--muted);letter-spacing:.06em}
textarea,.tin{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px 12px;resize:vertical;width:100%}
textarea{min-height:76px}
.rec{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.recdot.on{background:#D64545;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.transcript{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;font-size:14px;padding-right:4px}
.tline{display:grid;grid-template-columns:64px 1fr;gap:10px}
.tline b{font-size:12px;font-weight:700;padding-top:2px}
.trbox{min-height:220px;font-size:14px;line-height:1.65}
.summary{background:var(--sky-soft);border-radius:12px;padding:12px 14px;font-size:14px;white-space:pre-line;margin-top:6px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
.waiting{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- TEAM ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:16px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.kpi b{display:block;font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-bottom:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:18px}
.todo{display:flex;flex-direction:column}
.todo-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.todo-row:last-child{border-bottom:0}
.todo-row .who{flex:1;min-width:0;cursor:pointer}
.todo-row .who b{font-size:16px}
.todo-row .who span:not(.pill){display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbtn{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:none;display:grid;place-items:center;flex:none;padding:0}
.cbtn svg{opacity:0}
.cbtn:hover svg{opacity:.35}
.cbtn.on{background:var(--ink);color:var(--paper)}
.cbtn.on svg{opacity:1}
.assign{width:100%;border-collapse:collapse}
.assign th,.assign td{padding:8px;text-align:center;border-bottom:1px solid var(--line)}
.assign th{font-size:12px;color:var(--muted);font-weight:500}
.assign td:first-child,.assign th:first-child{text-align:left}
.tog{width:38px;height:28px;border-radius:8px;border:1px solid var(--line);background:none;font-size:13px}
.tog[aria-pressed="true"]{background:var(--sky-deep);border-color:var(--sky-deep);color:#fff}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.lane{background:var(--soft);border-radius:12px;padding:12px;min-width:0}
.lane h4{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between}
.lane .chip{display:flex;justify-content:space-between;margin-bottom:6px;cursor:pointer;background:var(--surface)}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:18px;border-bottom:1px solid var(--line)}

function status(p){
  if(p.registeredAt)return{t:'등록 완료',c:'ok'};
  if(p.transferredAt)return{t:'전입 완료',c:'ok'};
  if(p.track==='transfer'&&p.weeks[1]?.done)return{t:'전입 대기',c:'warn'};
  if(p.weeks[4]?.done)return{t:'교인 등록 대기',c:'warn'};
  const cur=[4,3,2,1].find(w=>p.weeks[w]?.checkin===today&&!p.weeks[w]?.done);
  if(cur)return{t:`${cur}주 진행 중`,c:'sky'};
  const l=lastDone(p);const gap=daysBetween(lastDate(p),today);
  if(l&&gap>=56)return{t:'장기 미출석',c:''};
  if(l&&gap>=14)return{t:`${Math.floor(gap/7)}주째 못 뵘`,c:'warn'};
  return{t:l?`${l}주 완료`:'1주 시작 전',c:''};
}

/* ================= WEEK 3·4 CHECK-IN: 이름 → 생년월일 (→ 전화번호) ================= */
const ID={w:0,i:0,d:{}};
function initIdent(w){
  if(ID.w!==w){ID.w=w;ID.i=0;ID.d={}}
  const fields=w===4?['name','birth','phone']:['name','birth'];
  const last=fields.length+1;
  const q={
   name:`<h2 class="qt">다시 만나 반가워요!</h2><p class="qs">이름을 알려주세요</p><input class="big" id="id-name" data-idf="name" placeholder="한국어 이름" autocomplete="off" enterkeyhint="next" value="${esc(ID.d.name)}"><p class="hint"></p>`,
   birth:`<h2 class="qt">생년월일</h2><p class="qs">8자리 · 예: 19890516</p><input class="big" id="id-birth" data-idf="birth" inputmode="numeric" placeholder="19950521" value="${esc(fmtBirth(ID.d.birth))}"><p class="hint"></p>`,
   phone:`<h2 class="qt">전화번호</h2><p class="qs">마지막 확인이에요</p><input class="big" id="id-phone" data-idf="phone" type="tel" inputmode="tel" placeholder="(201) 555-0123" value="${esc(fmtPhone(ID.d.phone))}"><p class="hint"></p>`};
  $('#stack').innerHTML=`<section class="step welcome" data-i="0"><div class="arc"><div class="cloud" style="width:46%;height:16%;left:30%;bottom:22%"></div><div class="cloud" style="width:30%;height:12%;left:52%;bottom:30%"></div></div>
    <div class="welcome-text"><p class="eyebrow">Week ${w}</p><div class="wordmark">HOLY<br>IMPACT</div><p class="sub">${w}주차 · ${WEEK_NAMES[w]}</p></div></section>
   ${fields.map((f,k)=>`<section class="step" data-i="${k+1}" data-idstep="${f}">${q[f]}</section>`).join('')}
   <section class="step" data-i="${last}" id="idres"></section>`;
  const ok={name:()=>(ID.d.name||'').trim().length>=2,birth:()=>validBirth(ID.d.birth),phone:()=>(ID.d.phone||'').length===10};
  const msg={name:'이름을 써 주세요',birth:'생년월일 8자리를 써 주세요',phone:'전화번호 10자리를 써 주세요'};
  const show=n=>{ID.i=n;$$('#stack .step').forEach((el,k)=>{el.classList.toggle('here',k===n);el.classList.toggle('above',k<n);el.classList.toggle('below',k>n)});
    $('#prog').style.width=Math.round(n/last*100)+'%';const nb=$('#nudge');nb.hidden=n===last;$('#nudgeTxt').textContent=n===0?'밀어서 시작':'밀어서 다음';
    const f=fields[n-1];nb.classList.toggle('dim',!!f&&!ok[f]());
    const inp=$(`#stack .step[data-i="${n}"] input`);if(inp)setTimeout(()=>{if(ID.i===n)inp.focus({preventScroll:true})},420)};
  const next=()=>{const f=fields[ID.i-1];
    if(f&&!ok[f]()){const el=$(`#stack .step[data-i="${ID.i}"]`);el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');$('.hint',el).textContent=msg[f];return}
    if(ID.i===last)return;if(ID.i===fields.length){match();}if(document.activeElement)document.activeElement.blur();show(ID.i+1)};
  const match=()=>{
    const norm=s=>(s||'').replace(/\s/g,'').toLowerCase();const n=norm(ID.d.name);const b=ID.d.birth;const bd=`${b.slice(0,4)}-${b.slice(4,6)}-${b.slice(6)}`;
    const p=db.people.find(x=>(norm(x.ko)===n||norm(x.en)===n)&&x.birth===bd&&(w<4||x.phone===ID.d.phone));
    const box=$('#idres');
    if(!p){box.innerHTML=`<h2 class="qt">정보를 찾지 못했어요</h2><p class="qs">처음 등록할 때 쓴 이름${w===4?', 생년월일, 전화번호':'과 생년월일'}이 맞는지 확인해 주세요.</p><button type="button" class="btn" style="align-self:flex-start" data-act="idRetry">다시 쓰기</button><p class="note" style="margin-top:18px">그래도 안 되면 순장님께 말씀해 주세요.</p>`;return}
    if(p.registeredAt||p.transferredAt||p.weeks[4]?.done){box.innerHTML=`<div class="done-check">${CHECK}</div><h2 class="qt">${esc(nm(p))}님은<br>과정을 모두 마쳤어요</h2><p class="qs">오늘도 와 주셔서 반가워요!</p>`;return}
    const nw=lastDone(p)+1;
    p.weeks[nw]=Object.assign(p.weeks[nw]||{},{checkin:today});save();
    const gap=lastDone(p)?daysBetween(lastDate(p),today):0;const s=seatOf(nw,p.id);
    box.innerHTML=`<div class="done-check">${CHECK}</div><h2 class="qt">${esc(nm(p))}님,<br>들어오셨어요!</h2>
     <p class="qs" style="margin-bottom:0">${nw}주차 · ${WEEK_NAMES[nw]}</p>
     ${nw!==w?`<p class="note" style="font-size:14px;margin:10px 0 0">${nw}주차 차례예요. 쉬었다 와도 괜찮아요, ${nw}주차부터 이어서 해요.</p>`:gap>=14?`<p class="note" style="font-size:14px;margin:10px 0 0">${Math.floor(gap/7)}주 만이에요. 다시 와 주셔서 고마워요!</p>`:''}
     <span class="seatinfo">${s?`테이블 ${s}에 자리가 있어요`:'순장님이 자리를 안내해 드릴 거예요'}</span>${liveHTML(nw)}`;
  };
  bindPhone();
  const ph=$('#phone');
  ph.addEventListener('swipe',e=>{if(e.detail>0)next();else if(ID.i>0&&ID.i<last)show(ID.i-1)});
  ph.addEventListener('input',e=>{const f=e.target.dataset.idf;if(!f)return;const h=$('.step.here .hint');if(h)h.textContent='';
    if(f==='name')ID.d.name=e.target.value;
    else{const max=f==='birth'?8:10;const d=digitInput(e,ID.d[f],max,f==='birth');ID.d[f]=d;e.target.value=f==='birth'?fmtBirth(d):fmtPhone(d);
      if(d.length===max){if(ok[f]())setTimeout(()=>{if(fields[ID.i-1]===f&&ok[f]())next()},350);else if(h)h.textContent='날짜를 확인해 주세요'}}
    $('#nudge').classList.toggle('dim',!ok[f]())});
  ph.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.target.dataset.idf){e.preventDefault();next()}});
  ph.addEventListener('click',e=>{if(e.target.closest('[data-act="idRetry"]')){show(1)}});
  show(ID.i===last?0:ID.i);
}

function chipHTML(p){return `<span class="chip ${UI.pickPid===p.id?'picked':''}" draggable="true" data-chip="${p.id}">${esc(nm(p))}${p.en?`<span class="en">${esc(p.en.split(' ')[0])}</span>`:''}</span>`}
function tableHTML(w,t,leadName,canRemove){
  const seat=(i,pos)=>{const st=pos?`style="${pos}"`:'';const cls=pos?'':' st';
    if(i===0)return `<div class="seat lead${cls}" ${st}>${leadName?esc(leadName)+'<small>순장</small>':'순장'}</div>`;
    const p=t.seats[i]&&byId(t.seats[i]);
    return p?`<div class="seat filled${cls}" ${st} data-seat="${t.id}:${i}" data-open="${p.id}" draggable="true" data-chip="${p.id}">${esc(nm(p))}<button class="x" data-act="unseat" data-seat="${t.id}:${i}" aria-label="자리 비우기">×</button></div>`
      :`<div class="seat${cls}" ${st} data-seat="${t.id}:${i}">+</div>`};
  let body;
  if(t.shape==='round')body=`<div class="tbl"><div class="top-c">${t.id}</div>${t.seats.map((_,i)=>{const a=-90+i*60;return seat(i,`left:${50+38*Math.cos(a*Math.PI/180)}%;top:${50+38*Math.sin(a*Math.PI/180)}%`)}).join('')}</div>`;
  else{const h=t.seats.length/2;body=`<div class="rtbl ${t.shape}"><div class="srow">${t.seats.slice(0,h).map((_,i)=>seat(i)).join('')}</div><div class="slab">${t.id}</div><div class="srow">${t.seats.slice(h).map((_,i)=>seat(i+h)).join('')}</div></div>`}

function rowsHTML(w,att){
  if(w===1)return `<div class="tablewrap"><table class="rows"><thead><tr><th>이름</th><th>성별 · 나이</th><th>전화</th><th>이메일</th><th>주소</th><th>직업</th><th>결혼</th><th>교회</th><th>세례</th><th>소개</th><th>상태</th></tr></thead><tbody>

  if(act==='assign'){const w=+a.dataset.w,l=a.dataset.l;const arr=db.assign[w];const i=arr.indexOf(l);if(i>=0){if(arr.length===1){toast('주차마다 한 명은 있어야 해요');return}arr.splice(i,1)}else arr.push(l);save();rerender();return}
  if(act==='csv'){copyCSV();return}
  if(act==='reset'){if(a.dataset.confirm){db=seed();save();F.d={};F.saved=null;F.i=0;CK.pid=null;toast('데모 데이터를 처음 상태로 돌렸어요');render()}else{a.dataset.confirm='1';a.textContent='한 번 더 누르면 초기화';setTimeout(()=>{if(a.isConnected){delete a.dataset.confirm;a.textContent='데모 초기화'}},3000)}return}
  // seating by tap
  const chip=e.target.closest('[data-chip]');const seat=e.target.closest('.seat[data-seat]');
  if(seat&&!seat.classList.contains('filled')&&UI.pickPid){placeSeat(curW(),seat.dataset.seat,UI.pickPid);return}
  if(chip&&!chip.classList.contains('seat')){UI.pickPid=UI.pickPid===chip.dataset.chip?null:chip.dataset.chip;$$('.pool .chip').forEach(c=>c.classList.toggle('picked',c.dataset.chip===UI.pickPid));return}
  const op=e.target.closest('[data-open]');if(op){openPerson(op.dataset.open);return}
});
const curW=()=>route==='w1-leader'?1:route==='w2-leader'?2:w34;
document.addEventListener('change',e=>{const a=e.target.dataset.act;
  if(a==='wrapChurch'){const row=e.target.closest('.wrow');const cu=row.querySelector('.wcustom');const isCustom=db.customChurches.some(c=>c.id===e.target.value);if(cu)cu.hidden=!isCustom}
  if(a==='viewer'){db.viewer[+e.target.dataset.w]=e.target.value;save();rerender()}
  if(a==='owner'){byId(e.target.dataset.pid).owner=e.target.value;save();rerender();toast('담당 순장을 바꿨어요')}
  if(a==='merge'&&e.target.value){const from=e.target.dataset.c,to=CHURCH_SEED.find(c=>c.id===e.target.value);db.people.forEach(p=>{if(p.church&&p.church.id===from)p.church=to});db.customChurches=db.customChurches.filter(c=>c.id!==from);save();toast(`${to.name}(으)로 합쳤어요`);rerender()}
});
let repT;document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.tr){recOf(+t.dataset.tr).text=t.value}
  if(t.dataset.rep){const p=byId(t.dataset.pid);p.weeks[+t.dataset.w][t.dataset.rep]=t.value;clearTimeout(repT);repT=setTimeout(save,300)}
  if(t.dataset.act==='funote'){const p=byId(t.dataset.pid);p.followups.find(x=>x.id===t.dataset.fid).note=t.value;clearTimeout(repT);repT=setTimeout(save,300)}
});
/* drag & drop seating */
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-chip]');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.chip);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const s=e.target.closest('.seat[data-seat]:not(.filled),[data-drop="pool"]');if(!s)return;e.preventDefault();$$('.seat.drop').forEach(x=>x!==s&&x.classList.remove('drop'));s.classList.add('drop')});
document.addEventListener('dragleave',e=>{const s=e.target.closest('.seat');if(s)s.classList.remove('drop')});
document.addEventListener('drop',e=>{const pid=e.dataTransfer.getData('text/plain');const s=e.target.closest('.seat[data-seat]:not(.filled)');const pool=e.target.closest('[data-drop="pool"]');
  if(s&&pid){e.preventDefault();placeSeat(curW(),s.dataset.seat,pid)}
  else if(pool&&pid){e.preventDefault();unseatPid(curW(),pid);save();rerender()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openPid){openPid=null;$('#layer').innerHTML=''}});

function showQR(w){
  const url=location.href.split('#')[0]+'#w'+w+'-phone';
  $('#layer').innerHTML=`<div class="scrim" data-act="closeLayer"></div><div class="modal" role="dialog" aria-label="QR 코드"><p class="eyebrow">${w}주차 · ${w===1?'새가족 등록':'체크인'}</p><h3 style="font-size:22px">QR을 찍어 주세요</h3><div id="qrbox"></div><p class="note">데모에서는 이 페이지의 새가족 화면으로 연결돼요.</p><button class="btn ghost sm" data-act="closeLayer">닫기</button></div>`;
  try{new QRCode($('#qrbox'),{text:url,width:180,height:180,colorDark:'#1E2A30',colorLight:'#ffffff'})}catch(err){$('#qrbox').innerHTML='<p class="note" style="color:#1E2A30">QR 라이브러리를 불러오지 못했어요</p>'}
}
function copyCSV(){
  const cols=['이름','영문','성별','생년월일','전화','이메일','주소','ZIP','타운','직업','결혼','소개','소개관계','온누리교인','교회','세례','첫방문','담당순장','1주','2주','3주','4주','등록','전입','팔로우업완료','팔로우업전체','예시'];
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=db.people.map(p=>[p.ko,p.en,p.gender,p.birth,fmtPhone(p.phone),p.email,p.street,p.zip,p.town,p.job,p.marital,p.referrer,p.referrerRel||'',p.onnuri?'Y':'N',p.church?p.church.name:'',baptText(p),p.createdAt,LN(p.owner),p.weeks[1]?.done||'',p.weeks[2]?.done||'',p.weeks[3]?.done||'',p.weeks[4]?.done||'',p.registeredAt||'',p.transferredAt||'',p.followups.filter(f=>f.done).length,p.followups.length,p.sample?'Y':'N'].map(q).join(','));
  const csv=[cols.map(q).join(','),...rows].join('\n');
  const ok=()=>toast(`${db.people.length}명 CSV를 복사했어요. 엑셀이나 구글 시트에 붙여 넣으세요`);
  try{navigator.clipboard.writeText(csv).then(ok,()=>fallback())}catch(err){fallback()}
  function fallback(){$('#layer').innerHTML=`<div class="scrim" data-act="closeLayer"></div><div class="modal" style="width:min(640px,calc(100% - 32px))"><h3>CSV</h3><textarea id="csvbox" style="height:240px;font-size:12px">${esc(csv)}</textarea><p class="note">전체 선택해서 복사하세요.</p><button class="btn ghost sm" data-act="closeLayer">닫기</button></div>`;$('#csvbox').select()}
}

setRoute();
</script>
